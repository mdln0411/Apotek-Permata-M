<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Detail Obat</title>
    <meta name="description" content="Aplikasi Farmasi - Detail Informasi Obat" />
    <style>
      /* ── Reset & Full Width Override ── */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #2e7d32;
      }

      /* Force Expo root containers to fill full width */
      #root,
      [data-reactroot],
      div[style*="max-width"] {
        width: 100% !important;
        max-width: 100% !important;
        min-height: 100vh;
      }

      /* Remove any mobile frame Expo adds by default */
      body > div > div {
        width: 100% !important;
        max-width: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
